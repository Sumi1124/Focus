name: Build and release StudyGuard

on:
  push:
    branches: [main]
    paths:
      - 'StudyGuard/**'
      - '.github/workflows/studyguard-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studyguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build StudyGuard for macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify timer restoration and notebook behavior
        working-directory: StudyGuard
        run: |
          mkdir -p work/checks
          swiftc -parse-as-library -swift-version 5 \
            -framework AppKit -framework Combine -framework SwiftUI -framework WebKit -framework PDFKit \
            StudyGuard.swift NotebookCore.swift Notebook.swift Tests/NotebookChecks.swift \
            -o work/checks/NotebookChecks
          python3 Tests/mock_ollama.py > work/checks/mock-ollama.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 0.1
          done
          work/checks/NotebookChecks

      - name: Compile Apple silicon and Intel app and create DMG
        working-directory: StudyGuard
        run: bash build.sh

      - name: Verify Sparkle update announcement
        working-directory: StudyGuard
        run: |
          SPARKLE_DIR="$(bash Scripts/bootstrap-sparkle.sh)"
          clang -Wno-deprecated-declarations -F "$SPARKLE_DIR" \
            -framework Foundation -framework Sparkle -Wl,-rpath,"$SPARKLE_DIR" \
            Tests/AppcastChecks.m -o work/checks/AppcastChecks
          work/checks/AppcastChecks Updates/appcast.xml

      - name: Package source and checksums
        working-directory: StudyGuard
        run: |
          source BuildConfig.sh
          git -C "$GITHUB_WORKSPACE" archive --format=zip --prefix="StudyGuard-$STUDYGUARD_VERSION/" \
            --output="$GITHUB_WORKSPACE/StudyGuard/releases/StudyGuard-$STUDYGUARD_VERSION-source.zip" "$GITHUB_SHA:StudyGuard"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path('releases').glob('*-source.zip'))
          with ZipFile(archive) as source:
              names = source.namelist()
              assert len(names) > 20, 'The source archive is empty or incomplete'
              assert any(name.endswith('/Notebook.swift') for name in names), 'Notebook source is missing'
              assert any(name.endswith('/build.sh') for name in names), 'Build script is missing'
              assert source.testzip() is None, 'Source ZIP failed its CRC check'
          print(f'Verified {len(names)} source archive entries.')
          PY
          cd releases
          shasum -a 256 "StudyGuard-$STUDYGUARD_VERSION-macOS-universal.dmg" \
            "StudyGuard-$STUDYGUARD_VERSION-source.zip" > "StudyGuard-$STUDYGUARD_VERSION-SHA256.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyGuard-macOS
          path: StudyGuard/releases/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified macOS release
        if: github.ref == 'refs/heads/main'
        working-directory: StudyGuard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source BuildConfig.sh
          tag="studyguard-v$STUDYGUARD_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            existing_size="$(gh release view "$tag" --json assets --jq '.assets[] | select(.name | endswith("-source.zip")) | .size')"
            if [[ "${existing_size:-0}" -lt 1024 ]]; then
              target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
              git fetch --depth=1 origin "$target"
              if [[ "$(git rev-parse "$target:StudyGuard")" != "$(git rev-parse "$GITHUB_SHA:StudyGuard")" ]]; then
                echo 'Cannot repair the source archive: the app source differs from the published release.'
                exit 1
              fi
              dmg_name="StudyGuard-$STUDYGUARD_VERSION-macOS-universal.dmg"
              source_name="StudyGuard-$STUDYGUARD_VERSION-source.zip"
              checksum_name="StudyGuard-$STUDYGUARD_VERSION-SHA256.txt"
              mkdir -p work/release-repair
              gh release download "$tag" --pattern "$dmg_name" --dir work/release-repair
              cp "releases/$source_name" "work/release-repair/$source_name"
              (cd work/release-repair && shasum -a 256 "$dmg_name" "$source_name" > "$checksum_name")
              gh release upload "$tag" "work/release-repair/$source_name" "work/release-repair/$checksum_name" --clobber
              echo 'Repaired the source archive and checksums; the published DMG is preserved.'
              exit 0
            fi
            echo "Release $tag already exists; preserving its assets."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('RELEASE_NOTES.md').read_text().split('\n# StudyGuard ', 1)[0]
          Path('work/release-notes.md').write_text(notes)
          PY
          gh release create "$tag" \
            "releases/StudyGuard-$STUDYGUARD_VERSION-macOS-universal.dmg" \
            "releases/StudyGuard-$STUDYGUARD_VERSION-source.zip" \
            "releases/StudyGuard-$STUDYGUARD_VERSION-SHA256.txt" \
            --target "$GITHUB_SHA" --title "StudyGuard $STUDYGUARD_VERSION — Study Notebook" \
            --notes-file work/release-notes.md
